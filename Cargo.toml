[workspace]
members = ["rust/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
nvimo = { git = "https://github.com/c-c-k/nvimo", features = [
  "neovim-0-12",
  "mlua-extras",
  "anyhow",
  "async",
  "macros",
  "userdata-wrappers",
] }
serde = { version = "1.0.228", features = ["derive"] }
